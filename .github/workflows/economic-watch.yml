name: Economic Watch weekly report

on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Write email recipients file
        run: echo "${{ secrets.EMAIL_RECIPIENTS }}" > EmailRecipients.txt

      - name: Compile
        run: javac -encoding UTF-8 *.java

      - name: Run Economic Watch (automatic mode)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: java -Dfile.encoding=UTF-8 EconomicWatchApp --automatic
